services:
  llm_api:
    # Imagen publicada por GitHub Actions (el VPS no compila, solo descarga).
    # Build local: docker build -f llm_api/Dockerfile -t ghcr.io/magolo1976/amibot-api:latest .
    image: ghcr.io/magolo1976/amibot-api:latest
    pull_policy: always
    container_name: amibot_llm_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MODELS_DIR=/app/models
    volumes:
      - ./model:/app/models:ro
