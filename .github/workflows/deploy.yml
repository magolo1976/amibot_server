name: Build, Test and Publish to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Compilacion C++17 en Linux y Pruebas Unitarias (Cero Regresiones)
  # ----------------------------------------------------------------------------
  test:
    name: Build & Run C++17 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++17 & CMake build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libgomp1

      - name: Build native libraries (llm_comms, stt_comms, tts_comms)
        run: |
          cmake -S resources/llm_comms -B resources/llm_comms/build -DCMAKE_BUILD_TYPE=Release
          cmake --build resources/llm_comms/build --config Release -j $(nproc)
          cmake -S resources/stt_comms -B resources/stt_comms/build -DCMAKE_BUILD_TYPE=Release
          cmake --build resources/stt_comms/build --config Release -j $(nproc)
          cmake -S resources/tts_comms -B resources/tts_comms/build -DCMAKE_BUILD_TYPE=Release
          cmake --build resources/tts_comms/build --config Release -j $(nproc)

      - name: Build and Run Unit Tests
        run: |
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release
          cmake --build test/build --config Release -j $(nproc)
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/libraries/llm_comms:$GITHUB_WORKSPACE/libraries/stt_comms:$GITHUB_WORKSPACE/libraries/tts_comms:$LD_LIBRARY_PATH"
          ./test/build/bin/amibot_unit_tests

  # ----------------------------------------------------------------------------
  # Job 2: Compilacion de imagen Docker multi-etapa y publicacion en GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./llm_api/Dockerfile
          push: true
          tags: |
            ghcr.io/magolo1976/amibot-api:latest
            ghcr.io/magolo1976/amibot-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
